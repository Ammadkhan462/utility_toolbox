name: utility_toolbox
description: A multi-tool utility app with QR, converter, PDF, text, OCR, and translation tools.
publish_to: 'none'
version: 1.2.0+9

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Framework widgets (e.g. .adaptive switches) reference CupertinoIcons;
  # icon tree-shaking keeps the cost to a few KB.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  permission_handler: ^11.4.0

  flutter_local_notifications: ^17.2.3
  in_app_purchase: ^3.2.1
  package_info_plus: ^8.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  gal: ^2.3.1
  pdf: ^3.11.3
  printing: ^5.14.2
  syncfusion_flutter_pdf: ^28.2.12
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_translation: ^0.12.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_image_compress: ^2.3.0
  crypto: ^3.0.3
  path: ^1.9.0
  sensors_plus: ^7.1.0
  geolocator: ^14.0.2
  # LGPL "audio" build of FFmpegKit: native encoders + libmp3lame/opus/vorbis,
  # no GPL x264/xvid. Video re-encoding uses h264_mediacodec (hardware) with a
  # native mpeg4 fallback; see video_converter_providers.dart.
  ffmpeg_kit_flutter_new_audio: ^2.5.7
  docx_to_text: ^1.0.1
  uuid: ^4.5.1
  image: ^4.2.0
  http: ^1.2.2
  tflite_flutter: ^0.12.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_colorpicker: ^1.1.0
  google_mobile_ads: ^9.1.0
  in_app_review: ^2.0.12
  google_mlkit_document_scanner: ^0.7.1
  google_mlkit_subject_segmentation: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
