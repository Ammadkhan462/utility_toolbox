name: utility_toolbox
description: A multi-tool utility app with QR, converter, PDF, text, OCR, and translation tools.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  permission_handler: ^11.4.0
  google_mobile_ads: ^5.3.1
  in_app_purchase: ^3.2.1
  package_info_plus: ^8.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  gal: ^2.3.1
  pdf: ^3.11.3
  printing: ^5.14.2
  syncfusion_flutter_pdf: ^28.2.12
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_translation: ^0.12.0
  google_mlkit_language_id: ^0.12.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
